<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08a5df">
<title>Scanner Targa | Strisce Blu</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#eef3f6;color:#123}
.app{max-width:560px;margin:auto;min-height:100vh;background:white}.header{background:#08a5df;color:white;padding:14px 18px;text-align:center}
.header img{max-height:105px;max-width:100%;object-fit:contain}.header h1{font-size:21px;margin:8px 0 0}.main{padding:16px}
.scanner{position:relative;background:#07131a;border-radius:18px;overflow:hidden;aspect-ratio:3/4} video{width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}.shade{position:absolute;background:rgba(0,0,0,.55)}
.top{left:0;right:0;top:0;height:37%}.bottom{left:0;right:0;bottom:0;height:37%}.left{left:0;top:37%;bottom:37%;width:7%}.right{right:0;top:37%;bottom:37%;width:7%}
.frame{position:absolute;left:7%;right:7%;top:37%;height:26%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 2px rgba(0,166,225,.7)}
.guide{position:absolute;top:29%;left:0;right:0;color:#fff;text-align:center;font-weight:800;text-shadow:0 1px 4px #000}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer}
.primary{background:#08a5df;color:white}.dark{background:#15242c;color:white}.full{width:100%;margin-top:10px}
.plate{width:100%;font-size:28px;text-align:center;text-transform:uppercase;letter-spacing:3px;padding:13px;border:2px solid #ccdbe2;border-radius:14px;margin-top:14px}
.statusline{text-align:center;font-size:13px;color:#567;margin:10px 0;min-height:18px}.result{display:none;margin-top:15px;border-radius:18px;padding:20px;text-align:center}
.ok{background:#e8f8ed;border:2px solid #2cad58}.no{background:#fff0f0;border:2px solid #e43b3b}.warn{background:#fff7e2;border:2px solid #e4a100}
.title{font-size:23px;font-weight:900}.big{font-size:30px;font-weight:900;letter-spacing:3px;margin:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#fff;padding:11px;border-radius:12px}.label{font-size:11px;color:#667;text-transform:uppercase}.value{font-weight:800;margin-top:4px}
canvas{display:none}.note{font-size:12px;color:#667;text-align:center;margin-top:10px}.fallback{margin-top:14px;padding-top:12px;border-top:1px solid #ddd}
#login{position:fixed;inset:0;background:#eef3f6;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{width:min(430px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.15);text-align:center}
.loginbox img{max-height:100px;max-width:100%;object-fit:contain}.loginbox h2{margin:18px 0 6px}.loginbox p{color:#667;margin:0 0 18px}
#pin{width:100%;font-size:25px;text-align:center;letter-spacing:4px;padding:14px;border:2px solid #ccdbe2;border-radius:14px}
.loginerr{color:#c22;font-weight:bold;min-height:20px;margin-top:12px}
</style>
</head>
<body>
<div id="login"><div class="loginbox">
<img src="brand.jpg" alt="Strisce Blu"><h2>ACCESSO RISERVATO</h2><p>Inserisci la password per accedere allo scanner.</p>
<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Password">
<button id="loginBtn" class="primary full">ACCEDI</button><div id="loginerr" class="loginerr"></div>
</div></div>
<div class="app">
<div class="header"><img src="brand.jpg" alt="Strisce Blu"><h1>Scanner Abbonamenti</h1></div>
<div class="main">
<div class="scanner"><video id="video" autoplay playsinline muted></video><div class="overlay">
<div class="shade top"></div><div class="shade bottom"></div><div class="shade left"></div><div class="shade right"></div>
<div class="guide">INQUADRA SOLO LA TARGA</div><div class="frame"></div></div></div>
<div class="controls"><button id="torch" class="dark">🔦 TORCIA</button><button id="scan" class="primary">📷 LEGGI TARGA</button></div>
<div id="status" class="statusline">Accesso richiesto.</div><input id="plate" class="plate" placeholder="AB123CD" maxlength="10">
<button id="check" class="primary full">VERIFICA MANUALMENTE</button><div id="result" class="result"></div>
<div class="fallback"><div class="note">Se la fotocamera non parte, puoi comunque digitare la targa. La torcia dipende dal supporto del telefono/browser.</div></div>
</div></div><canvas id="crop"></canvas>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyiwBCKfttsoQPBcsC7xgSiG_QsLUJPT_bYXWMM0UAtHZzI0_gSSOtE6ZINFZ5f2afw/exec";
const $=x=>document.getElementById(x); let ACCESS_PIN="",stream=null,track=null,torchOn=false,workerPromise=null;
function norm(s){return(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"")} function msg(s){$("status").textContent=s}
async function login(){
 const pin=$("pin").value.trim(); if(!pin){$("loginerr").textContent="Inserisci la password.";return}
 $("loginBtn").disabled=true;$("loginerr").textContent="Verifica…";
 try{
  const r=await fetch(API_URL+"?action=login&pin="+encodeURIComponent(pin)+"&_="+Date.now(),{cache:"no-store"});
  const d=await r.json();
  if(d.authorized){ACCESS_PIN=pin;$("login").style.display="none";$("loginerr").textContent="";startCamera()}
  else $("loginerr").textContent="Password errata.";
 }catch(e){$("loginerr").textContent="Errore di connessione."}
 finally{$("loginBtn").disabled=false}
}
$("loginBtn").onclick=login;$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
async function startCamera(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
 $("video").srcObject=stream;track=stream.getVideoTracks()[0];await $("video").play();const caps=track.getCapabilities?track.getCapabilities():{};
 $("torch").disabled=!caps.torch;if(!caps.torch)$("torch").textContent="🔦 NON DISP.";msg("Centra la targa nel riquadro e premi LEGGI TARGA.");preloadOCR();
 }catch(e){msg("Fotocamera non disponibile: inserisci la targa manualmente.");$("torch").disabled=true;$("scan").disabled=true}
}
function preloadOCR(){if(!workerPromise){workerPromise=(async()=>{const w=await Tesseract.createWorker("eng");await w.setParameters({tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",tessedit_pageseg_mode:"7",preserve_interword_spaces:"0"});return w})().catch(e=>{workerPromise=null;throw e})}return workerPromise}
$("torch").onclick=async()=>{if(!track)return;try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});$("torch").textContent=torchOn?"🔦 SPEGNI":"🔦 TORCIA"}catch(e){msg("Torcia non supportata.")}};
function cropPlate(){const v=$("video"),c=$("crop"),vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)throw new Error("Video non pronto");
const box=v.getBoundingClientRect(),scale=Math.max(box.width/vw,box.height/vh),shownW=vw*scale,shownH=vh*scale,offX=(shownW-box.width)/2,offY=(shownH-box.height)/2;
const rx=box.width*.07,ry=box.height*.37,rw=box.width*.86,rh=box.height*.26;let sx=(rx+offX)/scale,sy=(ry+offY)/scale,sw=rw/scale,sh=rh/scale;
sx=Math.max(0,sx);sy=Math.max(0,sy);sw=Math.min(vw-sx,sw);sh=Math.min(vh-sy,sh);c.width=Math.max(900,Math.round(sw*1.5));c.height=Math.round(c.width*(sh/sw));
const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);const im=ctx.getImageData(0,0,c.width,c.height),d=im.data;
for(let i=0;i<d.length;i+=4){let gray=.299*d[i]+.587*d[i+1]+.114*d[i+2];gray=(gray-128)*1.65+128;gray=Math.max(0,Math.min(255,gray));d[i]=d[i+1]=d[i+2]=gray}ctx.putImageData(im,0,0);return c}
function candidates(text){const raw=(text||"").toUpperCase(),out=[],compact=norm(raw),exact=raw.match(/[A-Z]{2}\s*[-.]?\s*\d{3}\s*[-.]?\s*[A-Z]{2}/g)||[];exact.forEach(x=>out.push(norm(x)));for(let i=0;i<=compact.length-7;i++){const x=compact.slice(i,i+7);if(/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(x))out.push(x)}return[...new Set(out)]}
async function verify(p){
 p=norm(p);if(!p)return false;$("plate").value=p;msg("Verifica "+p+"…");const b=$("result");b.style.display="block";b.className="result warn";b.innerHTML='<div class="title">VERIFICA…</div>';
 try{const r=await fetch(API_URL+"?targa="+encodeURIComponent(p)+"&pin="+encodeURIComponent(ACCESS_PIN)+"&_="+Date.now(),{cache:"no-store"});const d=await r.json();
 if(!d.authorized){ACCESS_PIN="";$("login").style.display="flex";$("pin").value="";$("loginerr").textContent="Password non valida. Accedi nuovamente.";b.style.display="none";return false}
 if(!d.found){b.className="result no";b.innerHTML='<div class="title">✕ NON ABBONATO</div><div class="big">'+p+'</div>'}
 else{b.className="result "+(d.active?"ok":"no");b.innerHTML='<div class="title">'+(d.active?"✓ ABBONAMENTO ATTIVO":"✕ ABBONAMENTO SCADUTO")+'</div><div class="big">'+p+'</div>'+
 '<div class="grid"><div class="card"><div class="label">Tipologia</div><div class="value">'+(d.type||"—")+'</div></div><div class="card"><div class="label">Scadenza</div><div class="value">'+(d.expiry||"—")+'</div></div></div>'}
 msg("Controllo completato.");return !!d.found
 }catch(e){b.className="result warn";b.innerHTML='<div class="title">ERRORE DI CONNESSIONE</div>';msg("Errore durante la verifica.");return false}
}
$("scan").onclick=async()=>{try{$("scan").disabled=true;msg("Acquisizione della sola area targa…");const c=cropPlate();msg("Lettura caratteri…");const w=await preloadOCR();const {data}=await w.recognize(c);const list=candidates(data.text);if(!list.length){msg("Targa non riconosciuta. Avvicinati e centra solo la targa.");$("result").style.display="none";return}$("plate").value=list[0];await verify(list[0])}catch(e){msg("Lettura non riuscita. Riprova o inserisci la targa manualmente.")}finally{$("scan").disabled=false}};
$("check").onclick=()=>verify($("plate").value);$("plate").addEventListener("keydown",e=>{if(e.key==="Enter")verify($("plate").value)});
window.addEventListener("beforeunload",()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
</script></body></html>
