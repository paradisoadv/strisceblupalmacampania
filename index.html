<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09a3db">
<title>Controllo Abbonamenti | Strisce Blu</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f9;color:#123}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.hero{background:#09a3db;color:#fff;padding:22px;text-align:center}
.hero img{width:100%;max-height:220px;object-fit:cover;object-position:top;border-radius:18px}.hero h1{font-size:25px;margin:16px 0 4px}.hero p{margin:0}
.main{padding:22px}.camera{border:2px dashed #b9ddea;border-radius:18px;padding:18px;text-align:center;background:#f8fdff}.camera input{display:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px}.primary{background:#09a3db;color:#fff}
.plate{width:100%;font-size:28px;text-transform:uppercase;text-align:center;letter-spacing:3px;padding:14px;border:2px solid #cddde5;border-radius:14px;margin-top:16px}
.hint{font-size:13px;color:#667;text-align:center;margin:8px}.result{display:none;margin-top:20px;border-radius:18px;padding:22px;text-align:center}
.ok{background:#e9f8ee;border:2px solid #2eae5b}.no{background:#fff0f0;border:2px solid #e43b3b}.warn{background:#fff8e6;border:2px solid #e8a400}
.status{font-size:25px;font-weight:800}.bigplate{font-size:30px;font-weight:800;letter-spacing:3px;margin:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.card{background:#fff;border-radius:12px;padding:12px}.label{font-size:12px;color:#667;text-transform:uppercase}.value{font-weight:800;margin-top:4px}
.loader{display:none;text-align:center;margin:16px 0;padding:14px;border-radius:12px;background:#eaf7fc;color:#057ca8;font-weight:700}.foot{text-align:center;font-size:12px;color:#889;padding:24px}
</style>
</head>
<body>
<div class="app">
<div class="hero"><img src="brand.jpg" alt="Strisce Blu"><h1>Controllo Abbonamenti</h1><p>Servizio sosta a pagamento</p></div>
<div class="main">
<div class="camera"><b>Fotografa la targa del veicolo</b><label class="btn primary" for="photo">📷 SCATTA FOTO ALLA TARGA</label>
<input id="photo" type="file" accept="image/*" capture="environment"><div class="hint">Scatto → lettura targa → verifica automatica.</div></div>
<input id="plate" class="plate" placeholder="AB123CD" maxlength="10"><button id="check" class="btn primary">VERIFICA ABBONAMENTO</button>
<div id="loader" class="loader"></div><div id="result" class="result"></div>
</div><div class="foot">Comune di Palma Campania · Strisce Blu</div></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxL7Kc7AgXdAfRWaex_envKzsBOX-j2tND6oMHVnRMgWrT7Msy_Cz4Fayq3sf-2hWFoLw/exec";
const $=id=>document.getElementById(id);
let worker=null, workerPromise=null;

function norm(s){return(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function loader(t){$("loader").textContent=t||"";$("loader").style.display=t?"block":"none"}

function getWorker(){
  if(!workerPromise){
    workerPromise=(async()=>{
      loader("Preparazione lettore targa…");
      worker=await Tesseract.createWorker("eng");
      await worker.setParameters({
        tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
        preserve_interword_spaces:"0"
      });
      loader("");
      return worker;
    })().catch(e=>{workerPromise=null;throw e});
  }
  return workerPromise;
}
// Precarica OCR mentre l'operatore usa l'app: i controlli successivi sono più rapidi.
if("requestIdleCallback" in window) requestIdleCallback(()=>getWorker().catch(()=>{}));
else setTimeout(()=>getWorker().catch(()=>{}),700);

function findPlate(text){
  const s=(text||"").toUpperCase();
  const m=s.match(/[A-Z]{2}\s*[-.]?\s*\d{3}\s*[-.]?\s*[A-Z]{2}/);
  if(m)return norm(m[0]);
  for(const x of s.split(/\s+/).map(norm)) if(/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(x))return x;
  return "";
}

async function verifica(){
  const p=norm($("plate").value);
  if(p.length<5){alert("Inserisci una targa valida.");return}
  $("plate").value=p;
  const b=$("result");b.style.display="block";b.className="result warn";b.innerHTML='<div class="status">VERIFICA…</div>';
  try{
    const r=await fetch(API_URL+"?targa="+encodeURIComponent(p)+"&_="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    if(!d.found){b.className="result no";b.innerHTML='<div class="status">✕ NON ABBONATO</div><div class="bigplate">'+p+'</div><p>Nessun abbonamento trovato.</p>';return}
    b.className="result "+(d.active?"ok":"no");
    b.innerHTML='<div class="status">'+(d.active?"✓ ABBONAMENTO ATTIVO":"✕ ABBONAMENTO SCADUTO")+'</div><div class="bigplate">'+p+'</div>'+
    '<div class="grid"><div class="card"><div class="label">Tipologia</div><div class="value">'+(d.type||"—")+'</div></div>'+
    '<div class="card"><div class="label">Scadenza</div><div class="value">'+(d.expiry||"—")+'</div></div></div>';
  }catch(e){b.className="result warn";b.innerHTML='<div class="status">ERRORE DI CONNESSIONE</div><p>Riprova.</p>'}
}

async function foto(file){
  try{
    loader("📷 Lettura targa…");
    const w=await getWorker();
    const {data}=await w.recognize(file);
    const p=findPlate(data.text);
    if(!p){loader("");alert("Targa non riconosciuta. Inseriscila manualmente.");$("plate").focus();return}
    $("plate").value=p;
    loader("✓ "+p+" · verifica…");
    await verifica();
  }catch(e){alert("Lettura foto non riuscita. Inserisci la targa manualmente.")}
  finally{loader("")}
}
$("photo").onchange=e=>{const f=e.target.files[0];if(f)foto(f)};
$("check").onclick=verifica;
$("plate").addEventListener("keydown",e=>{if(e.key==="Enter")verifica()});
</script>
</body></html>
